kind = "web"
previewPath = "/fatimak-portal/"
title = "Fatima K — Design System"
version = "1.0.0"
id = "artifacts/fatimak-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/fatimak-portal/" ]
localPort = 18360

[services.development]
run = "pnpm --filter @workspace/fatimak-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fatimak-portal", "run", "build" ]
publicDir = "artifacts/fatimak-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18360"
BASE_PATH = "/fatimak-portal/"
